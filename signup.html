<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign Up</title>
		<link rel="stylesheet" href="./css/token.css" />
		<link rel="stylesheet" href="./css/main2.css" />
	</head>
	<body class="signup">
		<main>
			<div class="container-card">
				<img src="images/Logo.png" alt="" width="163" height="44" class="logo" />
				<h2>Daftar</h2>
				<p>Selamat datang!</p>

				<form action="" class="child-card">
					<label for="username">Username <input type="text" name="username" id="username" placeholder="Masukkan username" /> </label>
					<label for="password">
						Kata Sandi
						<input type="password" name="password" id="password" placeholder="Masukkan kata sandi" />
					</label>
					<label for="passwordConfirm">
						Konfirmasi Kata Sandi
						<input type="password" name="passwordConfirm" id="passwordConfirm" placeholder="Masukkan kata sandi" />
					</label>
					<p>Sudah punya akun? <a href="signin.html">Masuk</a></p>

					<div class="child-button">
						<a href="signin.html">
							<b>Daftar</b>
						</a>
						<p>Atau</p>
						<a href="">
							<b><img src="/images/icon_google.png" alt="icon google" width="18" height="18" />Daftar dengan Google</b>
						</a>
					</div>
				</form>
			</div>
		</main>
	</body>
</html>
