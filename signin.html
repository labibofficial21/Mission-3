<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign In</title>
		<link rel="stylesheet" href="./css/token.css" />
		<link rel="stylesheet" href="./css/main2.css" />
	</head>
	<body class="signin">
		<main>
			<div class="container-card">
				<img src="images/Logo.png" alt="" width="103" height="30" class="logo" />
				<h2>Masuk</h2>
				<p>Selamat datang kembali!</p>

				<form action="" class="child-card">
					<label for="username">Username <input type="text" name="username" id="username" placeholder="Masukkan username" /> </label>
					<label for="password">
						Kata Sandi
						<input type="password" name="password" id="password" placeholder="Masukkan kata sandi" />
					</label>

					<div class="child-check-account">
						<p>Belum punya akun? <a href="signup.html">Daftar</a></p>
						<span>Lupa kata sandi?</span>
					</div>

					<div class="child-button">
						<a href="index.html">
							<b>Masuk</b>
						</a>
						<p>Atau</p>
						<a href="">
							<b><img src="/images/icon_google.png" alt="icon google" width="18" height="18" />Masuk dengan Google</b>
						</a>
					</div>
				</form>
			</div>
		</main>
	</body>
</html>
